name: AWS Cost Optimization CI/CD
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  python:
    name: Python Audit Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Python compile check
        run: python -m py_compile scripts/aws_cost_audit.py

      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v

      - name: Check for AWS credential patterns
        run: python scripts/check_secrets.py

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: python

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t aws-cost-audit:ci .

  terraform:
    name: Terraform Configuration Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate
